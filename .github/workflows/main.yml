name: Build Kernel with AnyKernel3

on:
  workflow_dispatch:

env:
  KERNEL_REPO: 'fenghuang11451/xiaomi_xaga_kernel'
  KERNEL_BRANCH: 'mglru'
  DEVICE_DEFCONFIG: 'xaga_defconfig'
  LOCALVERSION: '-Android12-9-00020-gc9f59ef34367-ab9585114'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y git zip make gcc-aarch64-linux-gnu lz4 \
            flex bison libssl-dev ccache bc

      - name: 下载 Clang 工具链
        run: |
          git clone --depth=1 \
            https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b \
            clang
          echo "$PWD/clang/bin" >> $GITHUB_PATH

      - name: 检出内核源码
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel

      - name: 检出 AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: anykernel3

      - name: 编译内核
        working-directory: kernel
        run: |
          export KBUILD_BUILD_TIMESTAMP="2023-02-08 23:50:57 +0000"

          # 1. 生成基础配置
          make ARCH=arm64 ${{ env.DEVICE_DEFCONFIG }}

          # 2. 直接修改 .config 文件（覆盖空值）
          sed -i 's/^CONFIG_LITTLE_CPU_MASK=.*/CONFIG_LITTLE_CPU_MASK="0x0F"/' .config
          sed -i 's/^CONFIG_BIG_CPU_MASK=.*/CONFIG_BIG_CPU_MASK="0x70"/' .config
          sed -i 's/^CONFIG_PRIME_CPU_MASK=.*/CONFIG_PRIME_CPU_MASK="0x80"/' .config
          # 如果某一行不存在，则追加（安全兜底）
          grep -q "^CONFIG_LITTLE_CPU_MASK=" .config || echo 'CONFIG_LITTLE_CPU_MASK="0x0F"' >> .config
          grep -q "^CONFIG_BIG_CPU_MASK=" .config || echo 'CONFIG_BIG_CPU_MASK="0x70"' >> .config
          grep -q "^CONFIG_PRIME_CPU_MASK=" .config || echo 'CONFIG_PRIME_CPU_MASK="0x80"' >> .config

          # 3. 自动填充其余选项（不交互）
          make ARCH=arm64 olddefconfig

          # 4. 开始编译
          make -j$(nproc) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            LOCALVERSION="${{ env.LOCALVERSION }}" \
            CONFIG_LTO_CLANG=y \
            CONFIG_LTO_NONE=n \
            CONFIG_LTO_CLANG_THIN=y \
            CONFIG_LTO_CLANG_FULL=n \
            CONFIG_LOCALVERSION_AUTO=n

      - name: 打包 AnyKernel3
        run: |
          if [ -f kernel/arch/arm64/boot/Image ]; then
            cp kernel/arch/arm64/boot/Image anykernel3/zImage
          elif [ -f kernel/arch/arm64/boot/Image.gz ]; then
            cp kernel/arch/arm64/boot/Image.gz anykernel3/zImage
          else
            echo "❌ 内核镜像未找到！"
            exit 1
          fi
          cd anykernel3
          rm -rf .git README.md *placeholder
          zip -r9 ../Kernel.zip * -x .git README.md *placeholder
          cd ..

      - name: 上传编译结果
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Package
          path: Kernel.zip
